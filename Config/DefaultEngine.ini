; Plik: Config/DefaultEngine.ini
; Mapa startowa = pusta mapa silnika; caly swiat (teren, swiatlo, niebo) stawia ASwiatGameMode w C++.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/grarts2d.SwiatGameMode

[/Script/Engine.Engine]
; Wiekszy near clip = lepsza precyzja glebi przy widoku do 800 km.
NearClipPlane=50.000000
+ActiveGameNameRedirects=(OldGameName="TP_BlankBP",NewGameName="/Script/grarts2d")

[/Script/Engine.RendererSettings]
r.DefaultFeature.MotionBlur=False
r.MotionBlurQuality=0
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; Wlaczone: czerwony napis, gdy zabraknie stron cieni (cienie znikaja w czesci ekranu - widziane 17.11 w regionie).
r.Shadow.Virtual.AllowScreenOverflowMessages=1
; Bez Lumena i ray tracingu: stylizowany wyglad i zapas wydajnosci na RTX 4060.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=False
r.RayTracing=False
r.Substrate=False
; Bez migotania (22.11.2026): TSR zawsze, piksele robi drugie skalowanie (KameraMapy::UstawPiksele).
r.AntiAliasingMethod=4
r.DefaultFeature.AntiAliasing=4
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False

[SystemSettings]
; Efekt pikseli: TSR wygladza obraz w 50% rozdzielczosci ekranu, potem najblizszy sasiad (0 = nearest) powieksza x2.
r.ScreenPercentage=100
; 22.11.2026: piksele 50% byly za rozmazane - pelna rozdzielczosc z TSR i wyostrzeniem.
r.SecondaryScreenPercentage.GameViewport=0
r.Tonemapper.Sharpen=0.8
r.Upscale.Quality=0
; Ostrzejsze tekstury terenu pod katem (mniej rozmycia i drgania ziarna trawy).
r.MaxAnisotropy=8
; TSR: tlumi migotanie drobnych, jasnych szczegolow (liscie, zdzbla).
r.TSR.ShadingRejection.Flickering=1
; Cienie w regionie: ~100 tys. drzew. Wiecej stron pamieci cieni i o polowe mniejsza rozdzielczosc (przy pikselach i tak niewidoczna),
; bo cienie urywaly sie w polowie ekranu.
r.Shadow.Virtual.MaxPhysicalPages=8192
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
; Ta sama rozdzielczosc cieni, gdy slonce sie przesuwa: bez skakania ostrosci cieni.
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.0

